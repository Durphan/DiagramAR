name: frontend-workflow
on:
  push:
    branches:
      - main
      - develop
    paths:
      - "frontend/**"
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "frontend/**"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Set up Node 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "npm"
      - name: Install dependencies
        run: npm ci --include=dev
      - name: Run audit
        run: npm audit --audit-level=moderates
      - name: Run linter
        run: npm run lint
      - name: Build frontend
        run: npm run build
      - name: Export build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: ./frontend/dist
